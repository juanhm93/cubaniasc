name: cubaniasc deployment

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
      url: "${{ github.ref == 'refs/heads/main' && 'https://cubaniasc.com' || 'https://cubaniasc.purphura.com' }}"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_DATABASE }}
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Prepare .env for CI
        run: cp .env.example .env
      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate application key
        run: php artisan key:generate --force
      - name: Run migrations the database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php artisan migrate --force --seed
      - name: Clear Config and Cache
        run: |
          php artisan config:cache
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Install Node Dependencies
        run: |
          npm install
          npm cache clean --force
      - name: Build Frontend Assets
        env:
          APP_URL: ${{ github.ref == 'refs/heads/main' && 'https://cubaniasc.com' || 'https://cubaniasc.purphura.com' }}
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: npm run build
      - name: Deploy staging to Purphura subdomain
        if: github.ref == 'refs/heads/develop'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_STAGING_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_STAGING_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_STAGING_PASSWORD || secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_STAGING_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.cursor/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            !.env.example
            !.env.staging.example
            !.env.production.example
      - name: Deploy production to cubaniasc.com
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_PRODUCTION_SERVER }}
          username: ${{ secrets.FTP_PRODUCTION_USERNAME }}
          password: ${{ secrets.FTP_PRODUCTION_PASSWORD }}
          server-dir: ${{ secrets.FTP_PRODUCTION_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.cursor/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            !.env.example
            !.env.staging.example
            !.env.production.example
